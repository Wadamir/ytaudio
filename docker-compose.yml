services:
  bot:
    build: .
    container_name: tg-ytaudio-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage/audio:/storage/audio
      - ./storage/db:/storage/db
    networks:
      ytaudio_net:
        ipv4_address: 172.25.0.3
    depends_on:
      proxy-primary:
        condition: service_healthy
      proxy-secondary:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      # Static internal IPs to bypass internal Docker DNS lookups entirely
      - YT_PROXY_PRIMARY=socks5h://172.25.0.5:1080
      - YT_PROXY_SECONDARY=socks5h://172.25.0.6:1080
      - HTTP_PROXY=socks5h://172.25.0.5:1080
      - HTTPS_PROXY=socks5h://172.25.0.5:1080

  # Primary proxy infrastructure container
  proxy-primary:
    image: serjs/go-socks5-proxy:latest
    container_name: ytaudio-proxy-primary
    restart: unless-stopped
    networks:
      ytaudio_net:
        ipv4_address: 172.25.0.5
    # Standard POSIX sh healthcheck to test port availability without bash or netcat
    healthcheck:
      test: ["CMD-SHELL", "sh -c ': </dev/tcp/127.0.0.1/1080' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3

  # Secondary backup proxy infrastructure container
  proxy-secondary:
    image: serjs/go-socks5-proxy:latest
    container_name: ytaudio-proxy-secondary
    restart: unless-stopped
    networks:
      ytaudio_net:
        ipv4_address: 172.25.0.6
    # Standard POSIX sh healthcheck to test port availability without bash or netcat
    healthcheck:
      test: ["CMD-SHELL", "sh -c ': </dev/tcp/127.0.0.1/1080' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 3

networks:
  ytaudio_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16






