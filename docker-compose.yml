version: "3.8"

services:
  bot:
    build: .
    container_name: tg-ytaudio-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage/audio:/storage/audio

  nginx:
    image: nginx:alpine
    container_name: tg-ytaudio-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./storage/audio:/storage/audio:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
