services:
  bot:
    build: .
    container_name: tg-ytaudio-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage/audio:/storage/audio
      - ./storage/db:/storage/db
    networks:
      - ytaudio_net
    depends_on:
      - proxy-primary
      - proxy-secondary
    environment:
      - PYTHONPATH=/app
      # Proxy for yt-dlp internal downloader logic
      - YT_PROXY_PRIMARY=socks5h://proxy-primary:1080
      - YT_PROXY_SECONDARY=socks5h://proxy-secondary:1080
      # System-wide proxy variables forcing python-telegram-bot (httpx) to route through our proxy container
      - HTTP_PROXY=socks5h://proxy-primary:1080
      - HTTPS_PROXY=socks5h://proxy-primary:1080

  # Primary proxy server
  proxy-primary:
    image: serjs/go-socks5-proxy:latest
    container_name: ytaudio-proxy-primary
    restart: unless-stopped
    networks:
      - ytaudio_net

  # Secondary backup proxy server
  proxy-secondary:
    image: serjs/go-socks5-proxy:latest
    container_name: ytaudio-proxy-secondary
    restart: unless-stopped
    networks:
      - ytaudio_net


