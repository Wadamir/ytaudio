server {
	listen 80;
	server_name dud-president.ru;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
    http2 on;
	server_name dud-president.ru;

	ssl_certificate /etc/letsencrypt/live/dud-president.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dud-president.ru/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	client_max_body_size 100M;

	location /audio/ {
		alias /storage/audio/;
		autoindex off;
		add_header Content-Disposition "attachment";
	}

	location / {
		return 404;
	}
}
