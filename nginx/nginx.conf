server {
    listen 80;
    server_name dud-president.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dud-president.ru;

    ssl_certificate /etc/letsencrypt/live/dud-president.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dud-president.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    # --- Trash scanners ---
    location ~* ^/(wp-|wordpress|admin|config|setup|install|shell|vendor|cgi-bin) {
        access_log off;
        return 404;
    }

    location ~* \.php$ {
        access_log off;
        return 404;
    }

    location ~* /(device\.rsp|containers/json|\.env|\.git) {
        access_log off;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --- Audio ---
    location /audio/ {
        alias /storage/audio/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    location / {
        return 404;
    }
}